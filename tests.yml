name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests numpy scipy pytest
      - name: Run tests
        # Fails loudly if any file in a deploy is out of step with the others --
        # the class of bug (half-updated files) that broke several runs this season.
        run: python -m pytest -q tests
