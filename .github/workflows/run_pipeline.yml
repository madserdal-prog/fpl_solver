name: FPL solver run

on:
  schedule:
    # Once a day, well ahead of typical Fri/Sat deadlines. Adjust as needed --
    # FPL deadlines shift around cup rounds and holiday schedules, which is
    # exactly why auto-gw detection (resolve_gw in run_real.py) matters more
    # than a fixed day-of-week here.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      initial_team:
        description: 'Build initial squad from scratch (no transfer penalty, e.g. GW1 before deadline)'
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests numpy scipy

      - name: Refresh my_team.json from your actual FPL team
        env:
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
        run: |
          # Auto-detects the current gameweek from events.json (written by collector.py),
          # then pulls picks for the PREVIOUS gameweek -- that reflects your squad as it
          # actually stands right now, including any real transfers you've made since.
          # --allow-missing means: if that gameweek's picks aren't public yet (e.g. its
          # deadline hasn't passed), this step quietly does nothing rather than failing
          # the whole workflow -- my_team.json just stays as it was.
          LAST_GW=$(python -c "
          import json
          with open('events.json') as f:
              events = json.load(f)
          import collector
          current = collector.get_current_gameweek(events)
          print(max(1, current['id'] - 1))
          " 2>/dev/null || echo "")
          if [ -n "$LAST_GW" ]; then
            python fetch_my_team.py --team-id "$FPL_TEAM_ID" --gw "$LAST_GW" --allow-missing
          else
            echo "Could not determine last gameweek (events.json missing?) -- skipping refresh."
          fi

      - name: Run solver (free critic, no API cost)
        run: |
          if [ "${{ github.event.inputs.initial_team }}" = "true" ]; then
            echo "Running with --initial-team (building from scratch, no transfer penalty)"
            python run_real.py --initial-team
          else
            python run_real.py
          fi

      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # Pick up whichever solver_solution_gw*.json file run_real.py just wrote,
          # and extract the gameweek number from its own filename.
          for f in solver_solution_gw*.json; do
            gw="${f#solver_solution_gw}"; gw="${gw%.json}"
            python report.py --solution "$f" --gw "$gw" --critic-flags "critic_flags_gw${gw}.json"
          done

      - name: Commit updated files
        run: |
          git config user.name "fpl-auto-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add solver_solution_gw*.json critic_flags_gw*.json forecast_gw*.json my_team.json
          git diff --staged --quiet || git commit -m "Auto solver run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase --autostash origin main
          git push
